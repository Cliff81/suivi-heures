{#
  Jeu d'icônes : un seul sprite SVG posé une fois dans la page,
  réutilisé partout via <use>. Aucune icône en texte (emoji) dans les pages :
  l'emoji dépend de la police du poste et ne se colore pas.
#}
{% macro ico(nom, cls="") -%}
<svg class="ico {{ cls }}" aria-hidden="true" focusable="false"><use href="#i-{{ nom }}"/></svg>
{%- endmacro %}
