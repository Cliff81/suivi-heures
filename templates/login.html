{% extends "base.html" %}
{% from "_icons.html" import ico %}
{% block title %}Connexion — Suivi des heures{% endblock %}

{% block layout %}
<div class="login-wrap">
  <form class="login" method="post">
    <div class="logo">{{ ico('logo') }}</div>
    <h1>Suivi des heures</h1>
    <p class="sub">Accord 39 heures</p>

    {% include "_flashes.html" %}

    <div class="field">
      <label for="login">Identifiant</label>
      <input id="login" type="text" name="login" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-lg btn-block" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
